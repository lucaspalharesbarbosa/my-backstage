# Apigee — contrato da exposição pública (proxy)
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-api
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: apigee-public-proxy-contract
  title: Apigee X — contrato proxy público
  description: >-
    Contrato da exposição pública no gateway — cabeçalhos obrigatórios,
    políticas de tráfego, rate limit e extensões corporativas (documentação
    de superfície, não substitui configuração no Apigee).
spec:
  type: openapi
  lifecycle: production
  owner: group:default/squad-seguranca
  system: system:default/apigee-x-gateway
  definition: |
    openapi: 3.0.3
    info:
      title: Apigee public proxy contract
      version: "1.0.0"
      description: >
        Convenções de pedidos através do proxy (X-Request-Id, X-Api-Key,
        quotas e limites). Ajustar servers e securitySchemes ao ambiente real.
    servers:
      - url: https://proxy-public.example.com
    paths:
      /health:
        get:
          summary: Health check do proxy
          responses:
            "200":
              description: OK
      /{product_path}:
        parameters:
          - name: product_path
            in: path
            required: true
            schema:
              type: string
        get:
          summary: Encaminhamento GET (rate limit aplicado no gateway)
          responses:
            "200":
              description: Resposta upstream
            "429":
              description: Rate limit excedido
