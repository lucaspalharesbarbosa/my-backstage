# Variáveis: .env na raiz do repositório (rode `docker compose` a partir dela).
# Valores padrão abaixo servem só para dev local se o .env não existir.
services:
  db:
    image: postgres:16-alpine
    container_name: backstage-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
      POSTGRES_DB: backstage_main
    ports:
      - "5432:5432"
    volumes:
      - backstage-data:/var/lib/postgresql/data
 
volumes:
  backstage-data: