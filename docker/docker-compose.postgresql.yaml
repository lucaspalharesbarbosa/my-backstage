services:
  db:
    image: postgres:16-alpine
    container_name: backstage-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: backstage_main
    ports:
      - "5432:5432"
    volumes:
      - backstage-data:/var/lib/postgresql/data
 
volumes:
  backstage-data: